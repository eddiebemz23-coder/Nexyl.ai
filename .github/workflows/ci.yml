name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Migrate and smoke-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexyl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexyl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nexyl
      JWT_SECRET: ci-only-throwaway-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # No API key is set here on purpose: the smoke test asserts the canned
      # fallback for open-ended input, and asserts a live model reply only when
      # a key is present.
      - run: npm run migrate

      - run: npm test

      # The Neon Function entrypoint is a second transport over the same core, so the
      # identical suite runs against it too and the deployed shape cannot rot unnoticed.
      - run: npm run function:build
      - run: npm run test:function
