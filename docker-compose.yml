# Optional: a ready-made PostgreSQL for local development.
#   docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexyl
    ports:
      - "5432:5432"
    volumes:
      - nexyl-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexyl"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Not started by a plain `up -d`: this stack's default target is the database.
  #   docker compose --profile app up -d --build
  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/nexyl
      # Interpolated with a default, not `:?`, so a db-only `up -d` still works.
      JWT_SECRET: ${JWT_SECRET:-replace-me-with-a-long-random-string}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NEXYL_LLM_MODEL: ${NEXYL_LLM_MODEL:-gemini-flash-lite-latest}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # The image ships the server only; schema and knowledge base are a deliberate step.
    command: sh -c "node scripts/migrate.js && node src/server.js"

volumes:
  nexyl-data:
