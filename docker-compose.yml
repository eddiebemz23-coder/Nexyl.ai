# Optional: a ready-made PostgreSQL for local development.
#   docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexl
    ports:
      - "5432:5432"
    volumes:
      - nexl-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexl"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexl-data:
